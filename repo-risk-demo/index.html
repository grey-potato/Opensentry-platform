<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repo Risk Frontend Demo</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <header class="topbar">
        <a class="brand brand-link" href="?page=home">
            <span class="brand-mark">OS</span>
            <div>
                <h1>OpenSentry Repo View</h1>
                <p>single repo / metadata + risk</p>
            </div>
        </a>

        <form id="global-search-form" class="global-search" role="search">
            <input id="global-search-input" name="q" type="search" placeholder="搜索 SHA / #编号 / 标题关键词 / 用户名"
                autocomplete="off" />
            <button type="submit">搜索</button>
        </form>
    </header>

    <nav id="main-nav" class="main-nav"></nav>

    <main id="app" class="page-wrap" aria-live="polite"></main>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
</body>

</html>
